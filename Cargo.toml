[package]
name = "databender"
version = "0.5.0"
edition = "2021"
description = "Deterministic, structure-aware media databending"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.5"
crossterm = "0.28"
dct-io = "0.1.1"
flate2 = "1.1"
image = { version = "0.25", default-features = false, features = ["avif", "avif-native", "jpeg", "png", "webp"] }
rand = "0.9"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
toml = "0.9"
wait-timeout = "0.2.1"
wasmtime = { version = ">=39, <41", default-features = false, features = ["cranelift", "runtime", "std", "wat"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
proptest = "1.7"

[[bench]]
name = "advanced"
harness = false
