[package]
name = "databender"
version = "0.1.0"
edition = "2021"
description = "Deterministic, structure-aware media databending"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.5"
flate2 = "1.1"
image = { version = "0.25", default-features = false, features = ["avif", "avif-native", "jpeg", "png", "webp"] }
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
thiserror = "2.0"
wait-timeout = "0.2.1"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
