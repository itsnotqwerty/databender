[package]
name = "databender-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
databender = { path = ".." }
libfuzzer-sys = "0.4"
serde_json = "1.0"

[[bin]]
name = "encoded_video"
path = "fuzz_targets/encoded_video.rs"
test = false
doc = false
bench = false

[[bin]]
name = "encoded_audio"
path = "fuzz_targets/encoded_audio.rs"
test = false
doc = false
bench = false

[[bin]]
name = "plugin_abi"
path = "fuzz_targets/plugin_abi.rs"
test = false
doc = false
bench = false

[[bin]]
name = "image_containers"
path = "fuzz_targets/image_containers.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
